<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>UI Overhaul</title>
  <!-- Preview (1920x1080, like the official mods). Text-free: the renderer loads no fonts.
       Shows the mod's idea in the game's dark UI style: a list window with quick filters, totals and
       green/red figures in every row, and a line card with two action buttons.
       make preview renders it to src/ui_overhaul/_metadata/0.png. -->
  <defs>
    <radialGradient id="sky" cx="960" cy="380" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d6b4f"/><stop offset="0.6" stop-color="#22402f"/><stop offset="1" stop-color="#0f1d16"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- map hint: tracks and stations -->
  <g stroke="#6f8f7a" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M60 900 C 420 760, 700 840, 980 700 S 1500 560, 1880 640"/>
    <path d="M120 180 C 460 260, 760 160, 1040 300 S 1560 620, 1860 820"/>
  </g>
  <g fill="#9fbfa9" opacity="0.55">
    <rect x="452" y="770" width="40" height="22" rx="6"/><rect x="960" y="690" width="40" height="22" rx="6"/>
    <rect x="1020" y="290" width="40" height="22" rx="6"/><rect x="1500" y="600" width="40" height="22" rx="6"/>
  </g>

  <!-- list window (Line Manager / Statistics style) -->
  <g filter="url(#shadow)">
    <rect x="250" y="150" width="900" height="760" rx="18" fill="#1f2a33"/>
  </g>
  <rect x="250" y="150" width="900" height="70" rx="18" fill="#26343f"/>
  <rect x="250" y="200" width="900" height="20" fill="#26343f"/>
  <!-- close button -->
  <circle cx="1112" cy="186" r="20" fill="#3c6f9e"/>
  <path d="M1103 177 L1121 195 M1121 177 L1103 195" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- quick filter toggle group (second one selected) and totals -->
  <rect x="290" y="250" width="420" height="52" rx="10" fill="#2c3a46"/>
  <rect x="292" y="252" width="100" height="48" rx="9" fill="#2c3a46"/>
  <rect x="396" y="252" width="104" height="48" rx="9" fill="#3c6f9e"/>
  <rect x="318" y="270" width="48" height="12" rx="6" fill="#c9d3dc"/>
  <rect x="420" y="270" width="56" height="12" rx="6" fill="#ffffff"/>
  <rect x="526" y="270" width="64" height="12" rx="6" fill="#c9d3dc"/>
  <rect x="616" y="270" width="72" height="12" rx="6" fill="#c9d3dc"/>
  <rect x="880" y="268" width="120" height="16" rx="8" fill="#c9d3dc"/>
  <rect x="1020" y="268" width="96" height="16" rx="8" fill="#e06363"/>

  <!-- column header line -->
  <rect x="290" y="330" width="820" height="2" fill="#3a4a57"/>

  <!-- rows: checkbox, colour dot, name, vehicle count, balance (red = losing) -->
  <g>
    <g transform="translate(0 0)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#28363f"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#e06363"/>
      <rect x="392" y="372" width="300" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="960" y="372" width="130" height="16" rx="8" fill="#e06363"/>
    </g>
    <g transform="translate(0 70)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#232f38"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#5aa0e0"/>
      <rect x="392" y="372" width="250" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="990" y="372" width="100" height="16" rx="8" fill="#e06363"/>
    </g>
    <g transform="translate(0 140)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#28363f"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#f0c04a"/>
      <rect x="392" y="372" width="330" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="950" y="372" width="140" height="16" rx="8" fill="#7cc48a"/>
    </g>
    <g transform="translate(0 210)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#232f38"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#b56ad6"/>
      <rect x="392" y="372" width="270" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="970" y="372" width="120" height="16" rx="8" fill="#7cc48a"/>
    </g>
    <g transform="translate(0 280)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#28363f"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#5fc9c0"/>
      <rect x="392" y="372" width="220" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="1000" y="372" width="90" height="16" rx="8" fill="#7cc48a"/>
    </g>
    <g transform="translate(0 350)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#232f38"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#e89a55"/>
      <rect x="392" y="372" width="290" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="960" y="372" width="130" height="16" rx="8" fill="#7cc48a"/>
    </g>
    <g transform="translate(0 420)">
      <rect x="290" y="352" width="820" height="56" rx="8" fill="#28363f"/>
      <rect x="306" y="368" width="24" height="24" rx="5" fill="none" stroke="#c9d3dc" stroke-width="3"/>
      <circle cx="362" cy="380" r="12" fill="#8fd16a"/>
      <rect x="392" y="372" width="240" height="16" rx="8" fill="#e8edf1"/>
      <rect x="880" y="372" width="28" height="16" rx="8" fill="#c9d3dc"/>
      <rect x="980" y="372" width="110" height="16" rx="8" fill="#7cc48a"/>
    </g>
  </g>

  <!-- line card (entity window) with two action buttons -->
  <g filter="url(#shadow)">
    <rect x="1230" y="300" width="460" height="560" rx="18" fill="#1f2a33"/>
  </g>
  <rect x="1270" y="340" width="260" height="22" rx="11" fill="#e8edf1"/>
  <rect x="1270" y="384" width="380" height="6" rx="3" fill="#7cc48a"/>
  <!-- section title line -->
  <rect x="1270" y="420" width="120" height="14" rx="7" fill="#c9d3dc"/>
  <rect x="1404" y="426" width="246" height="2" fill="#3a4a57"/>
  <!-- vehicle table rows with location pins -->
  <g fill="#28363f">
    <rect x="1270" y="452" width="380" height="44" rx="6"/>
    <rect x="1270" y="504" width="380" height="44" rx="6"/>
    <rect x="1270" y="556" width="380" height="44" rx="6"/>
  </g>
  <g fill="#e8edf1">
    <path d="M1292 486 C1281 474 1281 464 1281 464 A11 11 0 1 1 1303 464 C1303 464 1303 474 1292 486 Z" opacity="0.9"/><circle cx="1292" cy="464" r="4" fill="#28363f"/>
    <path d="M1292 538 C1281 526 1281 516 1281 516 A11 11 0 1 1 1303 516 C1303 516 1303 526 1292 538 Z" opacity="0.9"/><circle cx="1292" cy="516" r="4" fill="#28363f"/>
    <path d="M1292 590 C1281 578 1281 568 1281 568 A11 11 0 1 1 1303 568 C1303 568 1303 578 1292 590 Z" opacity="0.9"/><circle cx="1292" cy="568" r="4" fill="#28363f"/>
    <rect x="1320" y="467" width="170" height="14" rx="7"/>
    <rect x="1320" y="519" width="150" height="14" rx="7"/>
    <rect x="1320" y="571" width="180" height="14" rx="7"/>
    <rect x="1576" y="467" width="56" height="14" rx="7"/>
    <rect x="1576" y="519" width="56" height="14" rx="7"/>
    <rect x="1576" y="571" width="56" height="14" rx="7" fill="#e06363"/>
  </g>
  <!-- the two action buttons: copy (add) and depot arrow (remove) -->
  <rect x="1270" y="626" width="182" height="54" rx="12" fill="#3c6f9e"/>
  <rect x="1288" y="642" width="18" height="18" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="1296" y="650" width="18" height="18" rx="3" fill="#3c6f9e" stroke="#fff" stroke-width="3"/>
  <rect x="1328" y="647" width="104" height="12" rx="6" fill="#ffffff"/>
  <rect x="1466" y="626" width="182" height="54" rx="12" fill="#3c6f9e"/>
  <path d="M1484 668 V650 L1498 640 L1512 650 V668 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1498 664 V652 M1492 657 L1498 651 L1504 657" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="1524" y="647" width="104" height="12" rx="6" fill="#ffffff"/>
  <!-- stops table -->
  <rect x="1270" y="716" width="120" height="14" rx="7" fill="#c9d3dc"/>
  <rect x="1404" y="722" width="246" height="2" fill="#3a4a57"/>
  <g fill="#28363f">
    <rect x="1270" y="746" width="380" height="40" rx="6"/>
    <rect x="1270" y="794" width="380" height="40" rx="6"/>
  </g>
  <g fill="#e8edf1">
    <rect x="1284" y="760" width="14" height="12" rx="4"/><rect x="1312" y="760" width="190" height="12" rx="6"/>
    <rect x="1600" y="760" width="32" height="12" rx="6"/>
    <rect x="1284" y="808" width="14" height="12" rx="4"/><rect x="1312" y="808" width="160" height="12" rx="6"/>
    <rect x="1600" y="808" width="32" height="12" rx="6"/>
  </g>
</svg>
