<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>UI Overhaul</title>
  <!-- Preview image, 1920x1080, in the style of the tunnel-portal-fix preview: one white object on a dark
       blue glow, no text (the renderer loads no fonts). A game window with quick filters, list rows and
       a button, and a mouse pointer on the button. make preview renders it to _metadata/0.png. -->
  <defs>
    <radialGradient id="background-glow-fill" cx="960" cy="330" r="1150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a4c68"/><stop offset="0.55" stop-color="#173047"/><stop offset="1" stop-color="#0a1622"/>
    </radialGradient>
    <radialGradient id="ground-shadow-fill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window-bevel-fill" x1="600" y1="0" x2="1320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9bec3"/><stop offset="0.5" stop-color="#dfe2e5"/><stop offset="1" stop-color="#aeb3b8"/>
    </linearGradient>
    <linearGradient id="window-face-fill" x1="614" y1="0" x2="1306" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9dcdf"/><stop offset="0.3" stop-color="#f1f2f3"/><stop offset="0.7" stop-color="#eeeff0"/><stop offset="1" stop-color="#cfd2d5"/>
    </linearGradient>
    <linearGradient id="recess-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b9be"/><stop offset="0.35" stop-color="#cdd1d5"/><stop offset="1" stop-color="#d8dbde"/>
    </linearGradient>
    <linearGradient id="raised-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e6e9"/>
    </linearGradient>
    <linearGradient id="pointer-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e8ea"/>
    </linearGradient>
    <filter id="raised-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="pointer-shadow" x="-40%" y="-30%" width="200%" height="170%">
      <feDropShadow dx="10" dy="16" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1920" height="1080" fill="url(#background-glow-fill)"/>
  </g>

  <g id="window">
    <ellipse id="window-shadow" cx="960" cy="690" rx="470" ry="38" fill="url(#ground-shadow-fill)"/>
    <!-- slab: darker bevel band, then the inset front face -->
    <rect id="window-bevel" x="600" y="220" width="720" height="460" rx="36" fill="url(#window-bevel-fill)"/>
    <rect id="window-face" x="614" y="232" width="692" height="434" rx="26" fill="url(#window-face-fill)"/>
    <path id="window-highlight" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" d="M616,252 A26,26 0 0 1 640,233 H1280 A26,26 0 0 1 1304,252"/>

    <!-- title and close button -->
    <rect x="656" y="270" width="250" height="22" rx="11" fill="#9aa0a6"/>
    <circle cx="1250" cy="281" r="20" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
    <path d="M1242,273 L1258,289 M1258,273 L1242,289" stroke="#7d848b" stroke-width="4" stroke-linecap="round"/>
    <rect x="656" y="316" width="614" height="3" rx="1.5" fill="#c3c7cb"/>

    <!-- quick filters: a recessed track with the second segment pressed out, totals on the right -->
    <rect x="656" y="338" width="388" height="50" rx="25" fill="url(#recess-fill)"/>
    <rect x="752" y="342" width="98" height="42" rx="21" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
    <rect x="680" y="357" width="50" height="12" rx="6" fill="#a3a9af"/>
    <rect x="774" y="357" width="54" height="12" rx="6" fill="#6f767d"/>
    <rect x="870" y="357" width="62" height="12" rx="6" fill="#a3a9af"/>
    <rect x="954" y="357" width="68" height="12" rx="6" fill="#a3a9af"/>
    <rect x="1104" y="355" width="70" height="16" rx="8" fill="#9aa0a6"/>
    <rect x="1186" y="355" width="84" height="16" rx="8" fill="#5f666d"/>

    <!-- rows: recessed, with a raised line dot, a name and a figure; the middle one is the problem -->
    <g id="rows">
      <rect x="656" y="408" width="614" height="46" rx="14" fill="url(#recess-fill)"/>
      <circle cx="686" cy="431" r="10" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
      <rect x="712" y="424" width="250" height="14" rx="7" fill="#8f969c"/>
      <rect x="1166" y="424" width="80" height="14" rx="7" fill="#8f969c"/>

      <rect x="656" y="464" width="614" height="46" rx="14" fill="url(#recess-fill)"/>
      <circle cx="686" cy="487" r="10" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
      <rect x="712" y="480" width="210" height="14" rx="7" fill="#8f969c"/>
      <rect x="1140" y="480" width="106" height="14" rx="7" fill="#4c535a"/>

      <rect x="656" y="520" width="614" height="46" rx="14" fill="url(#recess-fill)"/>
      <circle cx="686" cy="543" r="10" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
      <rect x="712" y="536" width="280" height="14" rx="7" fill="#8f969c"/>
      <rect x="1180" y="536" width="66" height="14" rx="7" fill="#8f969c"/>
    </g>

    <!-- button with a plus -->
    <rect id="button" x="1052" y="588" width="218" height="50" rx="16" fill="url(#raised-fill)" filter="url(#raised-shadow)"/>
    <path d="M1084,603 V623 M1074,613 H1094" stroke="#6f767d" stroke-width="5" stroke-linecap="round"/>
    <rect x="1112" y="607" width="128" height="12" rx="6" fill="#a3a9af"/>
  </g>

  <!-- mouse pointer on the button: a thick white arrow with a grey side, like the rails' sleepers -->
  <g id="pointer" transform="translate(1206 616) rotate(-8) scale(1.15)" stroke-linejoin="round">
    <path id="pointer-side" fill="#9da2a7" d="M4,6 L4,98 L26,77 L41,112 L56,105 L41,71 L71,71 Z"/>
    <path id="pointer-top" fill="url(#pointer-fill)" stroke="#ffffff" stroke-width="2" filter="url(#pointer-shadow)" d="M0,0 L0,92 L22,71 L37,106 L52,99 L37,65 L67,65 Z"/>
  </g>
</svg>
